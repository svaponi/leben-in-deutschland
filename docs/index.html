<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leben in Deutschland – Training</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Leben in Deutschland</h1>
    <div id="stats"></div>
    <div class="bar"><div id="bar-fill"></div></div>
    <label class="opt"><input type="checkbox" id="berlin"> Berlin-Fragen (321–330) einbeziehen</label>
  </header>

  <section id="card" hidden>
    <p id="qnum"></p>
    <h2 id="question"></h2>
    <img id="image" alt="" hidden>
    <ul id="answers"></ul>
    <p id="explanation" hidden></p>
    <button id="next" hidden>Nächste Frage →</button>
  </section>

  <section id="done" hidden>
    <h2>Geschafft! 🎉</h2>
    <p>Du hast alle Fragen mindestens einmal richtig beantwortet.</p>
  </section>

  <footer><button id="reset" class="link">Fortschritt zurücksetzen</button></footer>
</main>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
