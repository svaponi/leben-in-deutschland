<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leben in Deutschland – Training</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div class="title-row">
      <h1>Leben in Deutschland</h1>
      <div id="lang"><button class="link" data-lang="de">de</button> | <button class="link" data-lang="en">en</button></div>
    </div>
    <div id="stats"></div>
    <div class="bar"><div id="bar-fill"></div></div>
  </header>

  <nav class="toolbar">
    <button id="prev" title="Vorherige (←)">←</button>
    <button id="toggle-grid" data-i18n="overview">Übersicht</button>
    <button id="next" title="Nächste (→)">→</button>
  </nav>

  <section id="grid" hidden>
    <div id="grid-general" class="grid-items"></div>
    <div id="grid-states" class="grid-items"></div>
  </section>

  <section id="card">
    <p id="qnum"></p>
    <div class="q-row">
      <h2 id="question"></h2>
      <button id="say-question" class="say">🔊</button>
    </div>
    <img id="image" alt="" hidden>
    <ul id="answers"></ul>
    <button id="continue" hidden data-i18n="continue">Nächste Frage →</button>
    <p id="explanation" hidden></p>
    <div class="speech">
      <label><input type="checkbox" id="auto-speak"> <span data-i18n="autoSpeak">automatisch vorlesen</span></label>
    </div>
  </section>

  <footer>
    <button id="reset" class="link" data-i18n="reset">Fortschritt zurücksetzen</button>
    <button id="reset-wrong" class="link" hidden></button>
  </footer>
</main>
<script src="questions.js"></script>
<script src="translations-en.js"></script>
<script src="app.js"></script>
</body>
</html>
